
name: CI-CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  continuous-integration:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --if-present

      - name: Build application
        run: npm run build

  continuous-deployment:
    name: Continuous Deployment
    needs: continuous-integration
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ionic-crud:latest .
        shell: powershell

      - name: Remove previous container
        run: |
          docker rm -f ionic-crud
          if ($LASTEXITCODE -ne 0) {
            Write-Host "No previous container to remove."
          }
        shell: powershell

      - name: Start updated container
        run: docker run -d --name ionic-crud --restart unless-stopped -p 8100:5173 ionic-crud:latest
        shell: powershell

      - name: Verify application
        run: |
          $success = $false
          for ($i = 1; $i -le 15; $i++) {
            try {
              Invoke-WebRequest http://localhost:8100/ -UseBasicParsing -TimeoutSec 2 | Out-Null
              $success = $true
              break
            } catch {
              Start-Sleep -Seconds 2
            }
          }
          if (-not $success) {
            docker logs ionic-crud
            exit 1
          }
          Write-Host "Application is responding successfully."
        shell: powershell
